<!DOCTYPE html>
<!--In this folder, we've got the three main ways of integrating HTML and CSS, whihc are: -->
<!--(1) You can put the CSS directly inline with the tag <style> -->
<!--(2) You can put the CSS in a separate file and then link it in using the <link rel = "stylesheet" media = "media query params" href="path"-->
<!--(3) You can import a CSS file that does @import url(href) (media query in regular text) or (another media query)" -->
<html>
<head>
	<title>Inline responsive CSS</title>
	<meta name="viewport" content="width=device-width, initial-scale=1"> 
	<!-- The meta tag was invented by Apple to grab this info from the device to scale nicely -->
	<!-- what is vh?  why vh for height, but % for width? -->
	<style>
		div { /* says "style any div elements like this" */
			width: 90%;
			margin: auto;
		}
		@media (max-width: 500px) { 
			/* This is a media query--think of it like a conditional; this says "if your device is up to 500px accordin to the meta info gained above, style this way*/
			div {
				background-color: red;
				height: 80vh;
			}
		}
		@media (min-width: 501px) and (max-width: 600px){
			/* Else if device has width between501px and 600px, style this way */
			div {
				background-color: green;
				height: 50vh;
			}
		}
		@media (min-width: 601px) {
			/* Else (if device has 601 px or more), style this way */
			div {
				background-color: blue;
				height: 20vh;
			}
		}
	</style>
</head>
<body>
	<div></div> 
	<!-- Style like the css element labeled "div"-->
</body>
</html>
